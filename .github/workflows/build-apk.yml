name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q "取件助手_Android_第四版_扫码修正版.zip" -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Fix JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()

          s = s.replace(
              '    compileSdk = 35\n',
              '    compileSdk = 35\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n'
          )

          s = s.replace(
              '    }\n}\ndependencies {',
              '    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\ndependencies {'
          )

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

         
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace \
            -Pkotlin.jvm.target.validation=warning

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PickupAssistant-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
